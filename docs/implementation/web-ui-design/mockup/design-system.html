<!doctype html>
<!--
  Speech Capture — MD3 design system (mockup)
  Standalone, clickable export of the design canvas artboard (Tokens.dc.html).
  Open it directly in a browser or WebStorm's preview. No build step, no network needed
  (fonts fall back to system fonts when offline).
  The markup inside <template id="dc-template"> and the Component class are the design source;
  the small runtime at the bottom only interprets them. See ../DESIGN.md for the spec.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speech Capture — MD3 design system (mockup)</title>
<style>sc-if,sc-for{display:contents}body{margin:0}</style>
</head>
<body>
<div id="app"></div>

<template id="dc-template">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600&amp;family=Roboto+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.srm{
--md-sys-color-primary:#415F91;--md-sys-color-on-primary:#FFFFFF;--md-sys-color-primary-container:#D6E3FF;--md-sys-color-on-primary-container:#001B3E;
--md-sys-color-secondary:#565F71;--md-sys-color-on-secondary:#FFFFFF;--md-sys-color-secondary-container:#DAE2F9;--md-sys-color-on-secondary-container:#131C2B;
--md-sys-color-tertiary:#705575;--md-sys-color-on-tertiary:#FFFFFF;--md-sys-color-tertiary-container:#FAD8FD;--md-sys-color-on-tertiary-container:#28132E;
--md-sys-color-error:#BA1A1A;--md-sys-color-on-error:#FFFFFF;--md-sys-color-error-container:#FFDAD6;--md-sys-color-on-error-container:#410002;
--app-success:#2F6A1E;--app-on-success:#FFFFFF;--app-success-container:#B6F29A;--app-on-success-container:#062100;
--app-warning:#7A5900;--app-on-warning:#FFFFFF;--app-warning-container:#FFDEA4;--app-on-warning-container:#261900;
--md-sys-color-surface:#F9F9FF;--md-sys-color-on-surface:#191C20;--md-sys-color-on-surface-variant:#44474E;
--md-sys-color-outline:#74777F;--md-sys-color-outline-variant:#C4C6D0;
--md-sys-color-surface-container-lowest:#FFFFFF;--md-sys-color-surface-container-low:#F3F3FA;--md-sys-color-surface-container:#EDEDF4;--md-sys-color-surface-container-high:#E7E8EE;--md-sys-color-surface-container-highest:#E2E2E9;
--md-sys-color-inverse-surface:#2E3036;--md-sys-color-inverse-on-surface:#F0F0F7;--md-sys-color-inverse-primary:#AAC7FF;
--app-new-row:rgba(65,95,145,.10);--md-sys-color-scrim:rgba(0,0,0,.32);
}
.srm.dark{
--md-sys-color-primary:#AAC7FF;--md-sys-color-on-primary:#0A305F;--md-sys-color-primary-container:#284777;--md-sys-color-on-primary-container:#D6E3FF;
--md-sys-color-secondary:#BEC6DC;--md-sys-color-on-secondary:#283141;--md-sys-color-secondary-container:#3E4759;--md-sys-color-on-secondary-container:#DAE2F9;
--md-sys-color-tertiary:#DDBCE0;--md-sys-color-on-tertiary:#3F2844;--md-sys-color-tertiary-container:#573E5C;--md-sys-color-on-tertiary-container:#FAD8FD;
--md-sys-color-error:#FFB4AB;--md-sys-color-on-error:#690005;--md-sys-color-error-container:#93000A;--md-sys-color-on-error-container:#FFDAD6;
--app-success:#9BD680;--app-on-success:#0B3900;--app-success-container:#185108;--app-on-success-container:#B6F29A;
--app-warning:#F5BF48;--app-on-warning:#412D00;--app-warning-container:#5C4200;--app-on-warning-container:#FFDEA4;
--md-sys-color-surface:#111318;--md-sys-color-on-surface:#E2E2E9;--md-sys-color-on-surface-variant:#C4C6D0;
--md-sys-color-outline:#8E9099;--md-sys-color-outline-variant:#44474E;
--md-sys-color-surface-container-lowest:#0C0E13;--md-sys-color-surface-container-low:#191C20;--md-sys-color-surface-container:#1D2024;--md-sys-color-surface-container-high:#282A2F;--md-sys-color-surface-container-highest:#33353A;
--md-sys-color-inverse-surface:#E2E2E9;--md-sys-color-inverse-on-surface:#2E3036;--md-sys-color-inverse-primary:#415F91;
--app-new-row:rgba(170,199,255,.12);--md-sys-color-scrim:rgba(0,0,0,.5);
}
.srm{font-family:'Roboto Flex',Roboto,system-ui,sans-serif;color:var(--md-sys-color-on-surface);background:var(--md-sys-color-surface);-webkit-font-smoothing:antialiased}
.srm *{box-sizing:border-box}
.mono{font-family:'Roboto Mono',ui-monospace,Consolas,monospace}
.srm button{font-family:inherit}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 24px;border-radius:20px;border:0;font-size:14px;font-weight:500;letter-spacing:.1px;cursor:pointer;white-space:nowrap}
.btn::after,.icon-btn::after,.chip::after,.nav-item::after,.seg-item::after,.rail-item .rail-ind::after,.list-btn::after,.status-btn::after{content:'';position:absolute;inset:0;border-radius:inherit;background:currentColor;opacity:0;transition:opacity .15s;pointer-events:none}
.btn:hover::after,.icon-btn:hover::after,.chip:hover::after,.nav-item:hover::after,.seg-item:hover::after,.rail-item:hover .rail-ind::after,.list-btn:hover::after,.status-btn:hover::after{opacity:.08}
.btn:active::after,.icon-btn:active::after,.chip:active::after,.nav-item:active::after,.seg-item:active::after,.list-btn:active::after{opacity:.12}
.srm button:focus-visible,.srm input:focus-visible,.srm [tabindex]:focus-visible{outline:3px solid var(--md-sys-color-secondary);outline-offset:2px}
.btn:disabled,.icon-btn:disabled,.chip:disabled,.seg-item:disabled,.list-btn:disabled{opacity:.38;cursor:not-allowed}
.btn:disabled::after,.list-btn:disabled::after{display:none}
.filled{background:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary)}
.tonal{background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container)}
.outlined{background:transparent;color:var(--md-sys-color-primary);border:1px solid var(--md-sys-color-outline)}
.textbtn{background:transparent;color:var(--md-sys-color-primary);padding:0 12px}
.danger{background:var(--md-sys-color-error);color:var(--md-sys-color-on-error)}
.icon-btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;padding:0;border:0;border-radius:20px;background:transparent;color:var(--md-sys-color-on-surface-variant);cursor:pointer;flex:none}
.chip{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--md-sys-color-outline-variant);background:transparent;color:var(--md-sys-color-on-surface-variant);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container);border-color:transparent}
.nav-item{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 16px;border:0;border-radius:28px;text-align:left;cursor:pointer;color:var(--md-sys-color-on-surface-variant);background:transparent}
.rail-item{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;color:var(--md-sys-color-on-surface-variant);cursor:pointer;font-size:12px;font-weight:500;padding:0;width:80px}
.rail-ind{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;width:56px;height:32px;border-radius:16px}
.seg{display:flex;border:1px solid var(--md-sys-color-outline);border-radius:20px;overflow:hidden;height:40px}
.seg-item{position:relative;overflow:hidden;flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:6px;border:0;border-right:1px solid var(--md-sys-color-outline);background:transparent;color:var(--md-sys-color-on-surface);font-size:14px;font-weight:500;cursor:pointer;padding:0 8px;min-width:0}
.seg-item:last-child{border-right:0}
.seg-item.on{background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container)}
.fld{position:relative;display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{position:absolute;top:-8px;left:12px;padding:0 4px;font-size:12px;line-height:16px;color:var(--md-sys-color-on-surface-variant);background:var(--fld-bg,var(--md-sys-color-surface));pointer-events:none}
.inp{height:56px;width:100%;border:1px solid var(--md-sys-color-outline);border-radius:4px;padding:0 16px;font-size:16px;background:transparent;color:var(--md-sys-color-on-surface);font-family:inherit}
.inp.sm{height:48px;font-size:14px}
.inp:focus{outline:none;border:2px solid var(--md-sys-color-primary);padding:0 15px}
.fld:focus-within label{color:var(--md-sys-color-primary)}
.inp.err{border-color:var(--md-sys-color-error)}
.fld .sup{font-size:12px;line-height:16px;color:var(--md-sys-color-on-surface-variant);padding:0 16px}
.fld .sup.err{color:var(--md-sys-color-error)}
.search{display:flex;align-items:center;gap:8px;height:48px;padding:0 4px 0 16px;border-radius:24px;background:var(--md-sys-color-surface-container-high);color:var(--md-sys-color-on-surface-variant);flex:1 1 220px;min-width:180px}
.search input{flex:1;border:0;background:transparent;font-size:16px;color:var(--md-sys-color-on-surface);font-family:inherit;min-width:0;height:100%}
.search input:focus{outline:none}
.search:focus-within{outline:2px solid var(--md-sys-color-primary)}
.switch{position:relative;width:52px;height:32px;border-radius:16px;border:2px solid var(--md-sys-color-outline);background:var(--md-sys-color-surface-container-highest);cursor:pointer;padding:0;flex:none}
.switch .knob{position:absolute;top:6px;left:6px;width:16px;height:16px;border-radius:8px;background:var(--md-sys-color-outline);transition:all .15s}
.switch.on{background:var(--md-sys-color-primary);border-color:var(--md-sys-color-primary)}
.switch.on .knob{left:22px;top:2px;width:24px;height:24px;border-radius:12px;background:var(--md-sys-color-on-primary)}
.list-btn{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 12px 8px 16px;border:1px solid var(--md-sys-color-outline-variant);border-radius:12px;background:var(--md-sys-color-surface-container-lowest);color:var(--md-sys-color-on-surface);cursor:pointer;text-align:left}
.status-btn{position:relative;overflow:hidden;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:4px;border:0;border-radius:20px;background:transparent;color:inherit;cursor:pointer}
.schip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:8px;background:var(--md-sys-color-surface-container-lowest);border:1px solid var(--md-sys-color-outline-variant);font-size:13px;font-weight:500;color:var(--md-sys-color-on-surface);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:4px;flex:none}
.live-dot{width:8px;height:8px;border-radius:4px;background:var(--app-success);animation:pulse 1.6s ease-in-out infinite;flex:none}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.logrow:hover{background:var(--md-sys-color-surface-container)}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scroll::-webkit-scrollbar{width:10px}.scroll::-webkit-scrollbar-thumb{background:var(--md-sys-color-outline-variant);border-radius:5px;border:2px solid transparent;background-clip:padding-box}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</helmet>
<div class="srm" style="width: 1440px; min-height: 2600px; background: var(--md-sys-color-surface); padding: 72px 80px; display: flex; flex-direction: column; gap: 64px;">

  <header style="display: flex; flex-direction: column; gap: 16px; max-width: 1000px;">
    <span class="mono" style="font-size: 12px; letter-spacing: 1px; color: var(--md-sys-color-primary);">DESIGN SYSTEM · MATERIAL DESIGN 3 · v0.1</span>
    <h1 style="margin: 0; font-size: 45px; line-height: 52px; font-weight: 400;">Speech Capture Monitor</h1>
    <p style="margin: 0; font-size: 16px; line-height: 24px; color: var(--md-sys-color-on-surface-variant);">MD3 tokens and components for the bridge’s web UI. Seed color #415F91, Roboto Flex for UI, Roboto Mono for everything machine-made: timestamps, seq numbers, key names, endpoints.</p>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 8px;">
      <div style="padding: 20px; border-radius: 16px; background: var(--md-sys-color-surface-container-low);"><div style="font-size: 16px; font-weight: 500; margin-bottom: 6px;">Speech is the content</div><div style="font-size: 14px; line-height: 20px; color: var(--md-sys-color-on-surface-variant);">Spoken text gets the largest type in the log (15/22). Chrome around it stays quiet: mono 12 for metadata.</div></div>
      <div style="padding: 20px; border-radius: 16px; background: var(--md-sys-color-surface-container-low);"><div style="font-size: 16px; font-weight: 500; margin-bottom: 6px;">State is color + words</div><div style="font-size: 14px; line-height: 20px; color: var(--md-sys-color-on-surface-variant);">Every status dot carries a label (“No voice”, “crashed”, “LIVE”). Colors that must be told apart also differ in lightness.</div></div>
      <div style="padding: 20px; border-radius: 16px; background: var(--md-sys-color-surface-container-low);"><div style="font-size: 16px; font-weight: 500; margin-bottom: 6px;">No feedback loop</div><div style="font-size: 14px; line-height: 20px; color: var(--md-sys-color-on-surface-variant);">The log is not an aria-live region by default, so a screen reader on the VM doesn’t record its own reading of the UI.</div></div>
    </div>
  </header>

  <section style="display: flex; flex-direction: column; gap: 24px;">
    <h2 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 400;">Color roles</h2>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px;">
      <sc-for list="{{schemes}}" as="sc" hint-placeholder-count="2">
        <div style="border-radius: 24px; padding: 24px; background: {{sc.bg}}; color: {{sc.fg}}; border: 1px solid #C4C6D0;">
          <div style="font-size: 16px; font-weight: 500; margin-bottom: 16px;">{{sc.name}}</div>
          <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px;">
            <sc-for list="{{sc.swatches}}" as="w" hint-placeholder-count="20">
              <div style="display: flex; flex-direction: column; gap: 6px;">
                <div style="height: 56px; border-radius: 12px; background: {{w.hex}}; border: 1px solid rgba(128,128,128,.25); display: flex; align-items: flex-end; padding: 6px 8px; color: {{w.on}}; font-size: 11px; font-weight: 500;">Aa</div>
                <div style="font-size: 12px; line-height: 16px; font-weight: 500;">{{w.name}}</div>
                <div class="mono" style="font-size: 11px; line-height: 14px; opacity: .75;">{{w.hex}}</div>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="border-radius: 16px; border: 1px solid var(--md-sys-color-outline-variant); overflow: hidden;">
      <div style="display: grid; grid-template-columns: 220px 120px minmax(0, 1fr); gap: 16px; padding: 12px 20px; background: var(--md-sys-color-surface-container); font-size: 12px; font-weight: 500; letter-spacing: .5px; color: var(--md-sys-color-on-surface-variant);"><span>ROLE</span><span>SAMPLE</span><span>USED FOR</span></div>
      <sc-for list="{{usage}}" as="u" hint-placeholder-count="8">
        <div style="display: grid; grid-template-columns: 220px 120px minmax(0, 1fr); gap: 16px; padding: 12px 20px; border-top: 1px solid var(--md-sys-color-outline-variant); align-items: center; font-size: 14px; line-height: 20px;">
          <span class="mono" style="font-size: 13px;">{{u.role}}</span>
          <span style="height: 28px; border-radius: 8px; background: {{u.bg}}; color: {{u.fg}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500;">{{u.sample}}</span>
          <span style="color: var(--md-sys-color-on-surface-variant);">{{u.use}}</span>
        </div>
      </sc-for>
    </div>
  </section>

  <section style="display: flex; flex-direction: column; gap: 24px;">
    <h2 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 400;">Type scale</h2>
    <div style="border-radius: 16px; border: 1px solid var(--md-sys-color-outline-variant); overflow: hidden;">
      <sc-for list="{{type}}" as="ty" hint-placeholder-count="9">
        <div style="display: grid; grid-template-columns: 200px 200px minmax(0, 1fr); gap: 24px; padding: 16px 20px; border-bottom: 1px solid var(--md-sys-color-outline-variant); align-items: baseline;">
          <span style="font-size: 14px; font-weight: 500;">{{ty.name}}</span>
          <span class="mono" style="font-size: 12px; color: var(--md-sys-color-on-surface-variant);">{{ty.spec}}</span>
          <span class="{{ty.cls}}" style="font-size: {{ty.size}}; line-height: {{ty.lh}}; font-weight: {{ty.weight}};">{{ty.sample}}</span>
        </div>
      </sc-for>
    </div>
  </section>

  <section style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px;">
    <div style="display: flex; flex-direction: column; gap: 20px;">
      <h2 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 400;">Shape</h2>
      <div style="display: flex; gap: 16px; flex-wrap: wrap;">
        <sc-for list="{{shapes}}" as="sh" hint-placeholder-count="6">
          <div style="display: flex; flex-direction: column; gap: 8px; align-items: center; width: 92px;">
            <div style="width: 80px; height: 80px; background: var(--md-sys-color-primary-container); border-radius: {{sh.r}};"></div>
            <span class="mono" style="font-size: 12px;">{{sh.label}}</span>
            <span style="font-size: 11px; line-height: 14px; color: var(--md-sys-color-on-surface-variant); text-align: center;">{{sh.use}}</span>
          </div>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 20px;">
      <h2 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 400;">Surfaces (tonal elevation)</h2>
      <div style="display: flex; gap: 0; border-radius: 16px; overflow: hidden; border: 1px solid var(--md-sys-color-outline-variant);">
        <sc-for list="{{surfaces}}" as="sf" hint-placeholder-count="5">
          <div style="flex: 1; height: 120px; background: {{sf.bg}}; padding: 12px; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px;">
            <span class="mono" style="font-size: 11px;">{{sf.name}}</span>
            <span style="font-size: 11px; color: var(--md-sys-color-on-surface-variant);">{{sf.use}}</span>
          </div>
        </sc-for>
      </div>
      <p style="margin: 0; font-size: 13px; line-height: 18px; color: var(--md-sys-color-on-surface-variant);">Elevation is tonal, not shadowed. Only dialogs, the snackbar and the “n new” button get a shadow, because they float over the log.</p>
    </div>
  </section>

  <section style="display: flex; flex-direction: column; gap: 32px;">
    <h2 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 400;">Components</h2>

    <div style="display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; align-items: center;">
      <div><div style="font-size: 16px; font-weight: 500;">Buttons</div><div style="font-size: 12px; color: var(--md-sys-color-on-surface-variant);">40 px, full radius, label-large</div></div>
      <div style="display: flex; gap: 12px; flex-wrap: wrap; align-items: center;">
        <button class="btn filled"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>Start session</button>
        <button class="btn tonal">Jump to latest</button>
        <button class="btn outlined">Export</button>
        <button class="btn textbtn">Cancel</button>
        <button class="btn danger">Wipe</button>
        <button class="btn filled" disabled="disabled">Press keys</button>
        <button class="icon-btn" aria-label="Actions panel (open)" aria-expanded="true" style="background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"></rect><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"></path></svg></button>
        <button class="icon-btn" aria-label="Add marker"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg></button>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; align-items: center;">
      <div><div style="font-size: 16px; font-weight: 500;">Status chips</div><div style="font-size: 12px; color: var(--md-sys-color-on-surface-variant);">top bar, one per service</div></div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">
        <span class="schip"><span class="dot" style="background: var(--app-success);"></span>1 voice · windows-1252</span>
        <span class="schip"><span class="dot" style="background: var(--md-sys-color-error);"></span>No voice</span>
        <span class="schip"><span class="dot" style="background: var(--app-warning);"></span>MCP 0.0.85 · crashed</span>
        <span class="schip"><span class="dot" style="background: var(--md-sys-color-outline);"></span>Input unavailable</span>
        <span class="schip"><span class="live-dot"></span>Session #7</span>
        <span style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 12px; background: var(--app-success-container); color: var(--app-on-success-container); font-size: 11px; font-weight: 600; letter-spacing: .5px;"><span class="live-dot"></span>LIVE</span>
      </div>
