openapi: 3.1.0
info:
  title: screenreader-speech-capture bridge API
  version: '1.10'
  summary: Capture what a screen reader says and read it over HTTP.
  description: |
    REST + Server-Sent Events API of the bridge. `info.version` is the API version that
    `GET /status` reports as `bridge.apiVersion` (`<major>.<minor>`; minor versions only add things).
    The prose reference is `docs/http-api.md`. The types match `packages/shared`.

    This file describes the endpoints the bridge serves today. Not implemented yet:
    `POST /set-focus`, `POST /input/keys`.

    Changes: 1.1 added `playwright` to `GET /status`, 1.2 added `mcp`, 1.3 added sessions
    (`/sessions`, `sessionId` on entries, the `session` filter and SSE event, `session` in the
    status), 1.4 added the bridge run (`instanceId` and `startedAt` in the status, `instanceId`
    in `SpeechList`, the SSE `bridge` event), 1.5 added `http.allowedHosts` to the config, the
    `FORBIDDEN` error and `session=none`, 1.6 added `restartRequired` to the `/config` answers
    (ports, hosts and the log output no longer change while running). 1.7 removed the bridge run
    (`instanceId` and the SSE `bridge` event) again: `seq` now keeps rising across restarts. 1.8
    removed settings and fields of features that don't exist yet: `tcp.format` (one possible
    value), `input` in the config and the status, and the `INPUT_DISABLED` error code (they come
    back with native input, M4). 1.9 added `startSeq` to `Session`. 1.10 added
    `client` to `Session`, the `X-SR-Speech-Client` request header and `replaced` in the
    `POST /sessions` answer.

    Every error has the same body (`ErrorBody`). Clients must handle unknown error codes as errors
    of their HTTP status.

    Every endpoint answers `403 FORBIDDEN` (`Forbidden`) when the `Host` header names a host the
    bridge doesn't answer to, or a `POST` / `PUT` / `DELETE` carries a foreign `Origin`
    (`docs/security.md#host-and-origin`).
  license:
    name: UNLICENSED
servers:
  - url: http://localhost:5151/api/v1
    description: Bridge on this machine (default HTTP port 5151)
  - url: http://{vm}:{port}/api/v1
    description: Bridge on a test VM
    variables:
      vm:
        default: my-test-vm
      port:
        default: '5151'
tags:
  - name: speech
    description: Recorded speech and markers
  - name: sessions
    description: Sessions group the speech of one test or agent task
  - name: bridge
    description: Status and configuration

paths:
  /speech:
    get:
      tags: [speech]
      operationId: listSpeech
      summary: List speech entries and markers
      description: |
        Entries with `seq > since`, oldest first. Page through the buffer by asking again with
        the last entry's `seq` as `since` while `hasMore` is `true`.
      parameters:
        - $ref: '#/components/parameters/Since'
        - name: limit
          in: query
          description: Maximum number of entries in the response.
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1000 }
        - $ref: '#/components/parameters/Session'
      responses:
        '200':
          description: |
            One page of entries. With `session`, `truncated` is only `true` when entries of that
            session were dropped.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpeechList' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/SessionNotFound' }
    delete:
      tags: [speech]
      operationId: clearSpeech
      summary: Wipe the buffer and the ended sessions
      description: |
        Removes all entries and all ended sessions. The current session stays current, empty.
        `seq` keeps counting. Meant for manual use: tests and agents start a session instead.
      responses:
        '204':
          description: Cleared.

  /speech/wait:
    get:
      tags: [speech]
      operationId: waitForSpeech
      summary: Wait for a matching speech entry (long-poll)
      description: |
        Waits for the first speech entry with `seq > since` that matches, including one that is
        already in the buffer. Exactly one of `contains` and `regex` is required. Markers never
        match. Closing the request stops the wait.

        Answers `200` both on a match and on timeout; `matched` tells them apart. A timeout is an
        expected answer, not an error (a `408` would make browsers and proxies repeat the
        request).
      parameters:
        - name: contains
          in: query
          description: Substring to look for.
          schema: { type: string, minLength: 1 }
          example: Submit, button
        - name: regex
          in: query
          description: Regular expression (JavaScript syntax, `u` flag) to look for, instead of `contains`.
          schema: { type: string }
          example: ^Submit
        - name: normalize
          in: query
          description: Ignore case and extra whitespace.
          schema: { type: string, enum: ['1', 'true', '0', 'false'] }
        - $ref: '#/components/parameters/Since'
        - name: timeoutMs
          in: query
          schema: { type: integer, minimum: 0, maximum: 300000, default: 5000 }
        - $ref: '#/components/parameters/Session'
      responses:
        '200':
          description: The matching entry, or every entry seen after `since` on timeout.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WaitResult' }
              examples:
                matched:
                  summary: A match
                  value:
                    matched: true
                    entry:
                      seq: 42
                      kind: speech
                      text: Submit, button
                      receivedAt: '2026-11-07T14:03:13.012Z'
                      source: tcp
                      voice: ssc5000
                      connectionId: 3
                timeout:
                  summary: No match in time
                  value:
                    matched: false
                    entries:
                      - seq: 41
                        kind: speech
                        text: Name, edit
                        receivedAt: '2026-11-07T14:03:12.345Z'
                        source: tcp
                        voice: ssc5000
                        connectionId: 3
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/SessionNotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /speech/stream:
    get:
      tags: [speech]
      operationId: streamSpeech
      summary: Stream new entries (Server-Sent Events)
      description: |
        One `entry` event per new entry, with the event `id` set to its `seq` and the entry as
        JSON `data`. After a clear, a `clear` event with `data: {}`. When a session starts or
        ends, a `session` event with the `Session` as `data` and no `id`. With `session`, only
        that session's `entry` events are sent; `clear` and `session` events always are. A
        `: ping` comment every 15 s keeps the connection open.

        A reconnect with `Last-Event-ID` first gets the buffered entries after that `seq`, then
        the live ones, with nothing missed or repeated in between. `seq` keeps rising across
        bridge restarts, so this also works after a restart. If some of the missed entries
        were already dropped because the buffer was full, a `truncated` event with `data: {}`
        comes before them.

        A client that stops reading is disconnected once about 1 MiB is waiting for it. It
        reconnects with `Last-Event-ID`.

        ```
        id: 42
        event: entry
        data: {"seq":42,"kind":"speech","text":"Submit, button",...}

        event: clear
        data: {}

        event: truncated
        data: {}

        event: session
        data: {"id":7,"name":"checkout test","run":null,...}
        ```
      parameters:
        - $ref: '#/components/parameters/Session'
        - name: Last-Event-ID
          in: header
          description: '`seq` of the last entry received before a reconnect.'
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: The event stream. It stays open until the client or the bridge closes it.
          content:
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/SessionNotFound' }

  /markers:
    post:
      tags: [speech]
      operationId: addMarker
      summary: Insert a marker into the timeline
      description: |
        The body must be sent as `application/json` (`400` with `field: content-type` otherwise),
        so a web page can't add markers cross-origin without a CORS preflight. At most 1 MiB.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkerRequest' }
      responses:
        '201':
          description: The new marker entry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpeechEntry' }
        '400': { $ref: '#/components/responses/InvalidRequest' }

  /sessions:
    get:
      tags: [sessions]
      operationId: listSessions
      summary: List the sessions
      description: The current session and the ended ones that still have entries in the buffer, newest first.
      responses:
        '200':
          description: The sessions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionList' }
    post:
      tags: [sessions]
      operationId: startSession
      summary: Start a session
      description: |
        The new session becomes current and the previous one ends. Every entry recorded while it
        is current, markers included, gets its `sessionId`. The body must be sent as
        `application/json`. Starting while another client's session is current (by
        `X-SR-Speech-Client`) is not refused: the bridge logs a warning and answers with that
        session in `replaced`.
      parameters:
        - $ref: '#/components/parameters/Client'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartSessionRequest' }
      responses:
        '201':
          description: The new session, and the session of another client it ended, if any.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartSessionResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }

  /sessions/end:
    post:
      tags: [sessions]
      operationId: endSession
      summary: End the current session
      description: >-
        Entries after this have `sessionId` `null`. Does nothing if no session is current. Ending
        another client's session (by `X-SR-Speech-Client`) is logged as a warning.
      parameters:
        - $ref: '#/components/parameters/Client'
      responses:
        '204':
          description: Ended (or none was current).

  /status:
    get:
      tags: [bridge]
      operationId: getStatus
      summary: Bridge state, versions, TCP connections, buffer and child services
      responses:
        '200':
          description: The current status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }

  /config:
    get:
      tags: [bridge]
      operationId: getConfig
      summary: The active configuration
      description: |
        Defaults, then the config file, then flags and environment variables, as in use. Plus the
        restart-only settings saved for the next start (`restartRequired`).
      responses:
        '200':
          description: The configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigResponse' }
    put:
      tags: [bridge]
      operationId: updateConfig
      summary: Change settings, in the config file and live
      description: |
        Takes any subset of the configuration. The whole patch is checked first, then saved to the
        config file (only the file's own settings plus the patch, never values from flags or
        environment variables), then applied to the running bridge.

        Restart-only settings (`tcp.*`, `http.host`, `http.port`, `log.file`,
        `log.consoleSpeech`) are only saved: they take effect on the next start and are listed in
        `restartRequired`. A flag or environment variable still wins on the next start (the
        bridge log warns about it). A `restartRequired` key in the body is ignored.

        The body must be `application/json` (`400` with `field: content-type` otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigPatch' }
            example: { tcp: { port: 4450 }, log: { level: debug } }
      responses:
        '200':
          description: The configuration in use.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigResponse' }
        '400':
          description: |
            Invalid or unknown setting, or a body that is not JSON. `error.details.field` names it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
              example:
                error:
                  code: INVALID_REQUEST
                  message: 'tcp.port: Cannot listen on 127.0.0.1:4450: the port is already in use (is another bridge running?)'
                  details: { field: tcp.port }

components:
  parameters:
    Since:
      name: since
      in: query
      description: Only entries with `seq` greater than this.
      schema: { type: integer, minimum: 0, default: 0 }
    Session:
      name: session
      in: query
      description: |
        Only entries of this session: its `id`, `current` for the session that is current
        when the request arrives (it is not followed to later sessions), or `none` for the
        entries recorded outside any session (`sessionId: null`, since 1.5).
      schema:
        oneOf:
          - { type: integer, minimum: 1 }
          - { type: string, enum: [current, none] }
    Client:
      name: X-SR-Speech-Client
      in: header
      required: false
      description: >-
        Names the client (the library sends `<host> pid <process id>`, the CLI `<host> cli`), so
        the bridge can warn when one client ends or replaces another one's session. Trimmed, at
        most 1000 characters. Added in API 1.10.
      schema: { type: string, maxLength: 1000 }

  responses:
    SessionNotFound:
      description: '`session=current` while no session is current, or a session id never given out.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
          example:
            error:
              code: NOT_FOUND
              message: No session is current
    InvalidRequest:
      description: Bad query or body. `error.details.field` names the field.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
          example:
            error:
              code: INVALID_REQUEST
              message: 'limit: must be an integer from 1 to 10000'
              details: { field: limit }
    Forbidden:
      description: Foreign `Host` header or `Origin` (DNS rebinding and cross-site protection).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
          example:
            error:
              code: FORBIDDEN
              message: >-
                Host "rebind.example" is not allowed. Use the bridge's IP address, or add the name
                to http.allowedHosts (--allowed-hosts)
              details: { host: rebind.example }
    ServiceUnavailable:
      description: The bridge is shutting down.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }

  schemas:
    SpeechEntry:
      type: object
      description: One recorded speech line or a marker.
      required: [seq, kind, text, receivedAt, source, voice, connectionId, sessionId]
      properties:
        seq:
          type: integer
          minimum: 1
          description: |
            Increasing sequence number. Survives clear and keeps rising across restarts: the
            first entry of a bridge run gets the run's start time in milliseconds.
        kind: { type: string, enum: [speech, marker] }
        text: { type: string }
        receivedAt:
          type: string
          format: date-time
          description: When the bridge received the line (UTC).
        source:
          type: string
          enum: [tcp, api]
          description: '`tcp` for speech, `api` for markers.'
        voice:
          type: [string, 'null']
          description: Header (`voice=<id>`) of the sending voice, `null` if not set or for markers.
        connectionId:
          type: [integer, 'null']
          description: TCP connection that delivered it, `null` for markers.
        sessionId:
          type: [integer, 'null']
          description: The session that was current, `null` outside any session. Added in API 1.3.
      example:
        seq: 42
        kind: speech
        text: Submit, button
        receivedAt: '2026-11-07T14:03:12.345Z'
        source: tcp
        voice: ssc5000
        connectionId: 3
        sessionId: 7

    SpeechList:
      type: object
      required: [entries, truncated, hasMore]
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/SpeechEntry' }
        truncated:
          type: boolean
          description: '`true` when entries after `since` were dropped because the buffer was full.'
        hasMore:
          type: boolean
          description: "`true` when more entries follow: ask again with the last entry's `seq` as `since`."

    MarkerRequest:
      type: object
      required: [label]
      properties:
        label:
          type: string
          description: Marker text. Trimmed, must not be empty, at most 1000 characters.
          example: step 3

    Session:
      type: object
      description: A session (docs/speech-capture.md#sessions). Added in API 1.3.
      required: [id, name, run, client, startedAt, endedAt, startSeq, firstSeq, lastSeq, entries]
      properties:
        id: { type: integer, minimum: 1, description: Increasing, restarts at 1 with the bridge. }
        name: { type: string }
        run: { type: [string, 'null'], description: Optional label that groups sessions. }
        client:
          type: [string, 'null']
          description: >-
            Who started it: the `X-SR-Speech-Client` header, `null` if it wasn't sent. Added in
            API 1.10.
        startedAt: { type: string, format: date-time }
        endedAt:
          type: [string, 'null']
          format: date-time
          description: '`null` while the session is current.'
        startSeq:
          type: integer
          description: >-
            The last `seq` given out before the session started: `since=startSeq` reads the
            session from its start. Added in API 1.9.
        firstSeq:
          type: [integer, 'null']
          description: First entry still in the buffer, `null` if none.
        lastSeq:
          type: [integer, 'null']
          description: Last entry still in the buffer, `null` if none.
        entries: { type: integer, description: Entries of this session still in the buffer. }
      example:
        id: 7
        name: form › submit button is announced
        run: nightly-42
        client: ci-runner pid 4242
        startedAt: '2026-11-12T09:31:04.120Z'
        endedAt: null
        startSeq: 339
        firstSeq: 340
        lastSeq: 342
        entries: 3

    StartSessionResponse:
      description: >-
        The new session, plus `replaced`: the session this start ended if another client had
        started it, `null` otherwise. Added in API 1.10.
      allOf:
        - $ref: '#/components/schemas/Session'
        - type: object
          required: [replaced]
          properties:
            replaced:
              oneOf:
                - $ref: '#/components/schemas/Session'
                - type: 'null'

    SessionList:
      type: object
      required: [sessions, currentId]
      properties:
        sessions:
          type: array
          items: { $ref: '#/components/schemas/Session' }
        currentId: { type: [integer, 'null'] }

    StartSessionRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: For example the test title. Trimmed, must not be empty, at most 1000 characters.
          example: checkout test
        run:
          type: [string, 'null']
          description: Optional label that groups sessions, for example one per test run. Same limits as `name`.
          example: nightly-42

    Status:
      type: object
      required: [bridge, tcp, buffer, playwright, mcp, session]
      properties:
        bridge:
          type: object
          required: [version, apiVersion, state, startedAt]
          properties:
            version: { type: string, description: Package version of the bridge., example: 0.3.0 }
            apiVersion:
              { type: string, description: '`<major>.<minor>` of this API.', example: '1.0' }
            state: { type: string, enum: [starting, ready, stopping] }
            startedAt:
              type: string
              format: date-time
              description: When this bridge run started.
        tcp:
          type: object
          required: [listening, host, port, encoding, connections]
          properties:
            listening: { type: boolean }
            host: { type: string }
            port: { type: integer }
            encoding: { type: string, description: Code page used to decode the socket voice. }
            connections:
              type: array
              description: Open connections, oldest first.
              items:
                type: object
                required: [id, voice, connectedAt]
                properties:
                  id: { type: integer }
                  voice: { type: [string, 'null'] }
                  connectedAt: { type: string, format: date-time }
        buffer:
          type: object
          required: [size, maxEntries, firstSeq, lastSeq]
          properties:
            size: { type: integer }
            maxEntries: { type: integer }
            firstSeq: { type: [integer, 'null'] }
            lastSeq: { type: [integer, 'null'] }
        playwright:
          description: Added in API 1.1.
          allOf: [{ $ref: '#/components/schemas/ServiceStatus' }]
        mcp:
          description: Added in API 1.2.
          allOf: [{ $ref: '#/components/schemas/ServiceStatus' }]
        session:
          type: object
          description: Added in API 1.3.
          required: [current, count]
          properties:
            current:
              oneOf:
                - { $ref: '#/components/schemas/Session' }
                - { type: 'null' }
            count: { type: integer, description: Number of sessions `GET /sessions` lists. }

    Config:
      type: object
      description: The bridge configuration (docs/configuration.md).
      required: [tcp, http, playwright, mcp, buffer, log]
      properties:
        tcp:
          type: object
          required: [host, port, encoding, maxLineBytes]
          properties:
            host: { type: string }
            port: { type: integer, minimum: 0, maximum: 65535 }
            encoding:
              { type: string, description: TextDecoder label of the socket voice's code page. }
            maxLineBytes: { type: integer, minimum: 1024, maximum: 16777216 }
        http:
          type: object
          required: [host, port, allowedHosts]
          properties:
            host: { type: string }
            port: { type: integer, minimum: 0, maximum: 65535 }
            allowedHosts: { $ref: '#/components/schemas/AllowedHosts' }
        playwright: { $ref: '#/components/schemas/ServiceConfig' }
        mcp: { $ref: '#/components/schemas/McpConfig' }
        buffer:
          type: object
          required: [maxEntries]
          properties:
            maxEntries: { type: integer, minimum: 1, maximum: 1000000 }
        log:
          type: object
          required: [level, file, consoleSpeech]
          properties:
            level: { type: string, enum: [error, warn, info, debug] }
            file:
              type: [string, 'null']
              description: Bridge log file, `null` = default path.
            consoleSpeech:
              type: boolean
              description: Also write the speech text to the console.

    ConfigResponse:
      description: |
        `Config` as in use, plus the restart-only settings saved with another value, which take
        effect on the next start. Since API 1.6.
      allOf:
        - { $ref: '#/components/schemas/Config' }
        - type: object
          required: [restartRequired]
          properties:
            restartRequired:
              type: array
              items: { type: string }
              example: [tcp.port]

    ConfigPatch:
      type: object
      description: |
        Any subset of `Config` (`PUT /config`). Settings left out keep their value; unknown ones
        are rejected. Ranges as in `Config`.
      additionalProperties: false
      properties:
        tcp:
          type: object
          additionalProperties: false
          properties:
            host: { type: string }
            port: { type: integer, minimum: 0, maximum: 65535 }
            encoding: { type: string }
            maxLineBytes: { type: integer, minimum: 1024, maximum: 16777216 }
        http:
          type: object
          additionalProperties: false
          properties:
            host: { type: string }
            port: { type: integer, minimum: 0, maximum: 65535 }
            allowedHosts: { $ref: '#/components/schemas/AllowedHosts' }
        playwright: { $ref: '#/components/schemas/ServiceConfigPatch' }
        mcp: { $ref: '#/components/schemas/McpConfigPatch' }
        buffer:
          type: object
          additionalProperties: false
          properties:
            maxEntries: { type: integer, minimum: 1, maximum: 1000000 }
        log:
          type: object
          additionalProperties: false
          properties:
            level: { type: string, enum: [error, warn, info, debug] }
            file: { type: [string, 'null'] }
            consoleSpeech: { type: boolean }

    ServiceStatus:
      type: object
      description: A child service (docs/operations.md#child-service-crashes).
      required: [state, version, port, restarts, exitCode]
      properties:
        state:
          type: string
          enum: [stopped, starting, running, crashed, failed]
          description: |
            `starting` includes the install. `crashed`: it exited and restarts after a delay.
            `failed`: 5 crashes in a row; restart the bridge (or change the service's settings).
        version:
          {
            type: string,
            description: The version that runs (configured or bundled).,
            example: 1.65.0,
          }
        port: { type: integer }
        restarts:
          {
            type: integer,
            description: Restarts after crashes since the service was last started (bridge start or config change).,
          }
        exitCode:
          type: [integer, 'null']
          description: Exit code of the last unexpected exit. `null` if none, or killed by a signal.

    ServiceConfigPatch:
      type: object
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        port: { type: integer, minimum: 0, maximum: 65535 }
        version:
          type: [string, 'null']
          description: |
            `null` = bundled. Otherwise an exact version (`1.65.0`, pattern
            `^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$`).

    ServiceConfig:
      type: object
      required: [enabled, port, version]
      properties:
        enabled: { type: boolean }
        port: { type: integer, minimum: 0, maximum: 65535 }
        version:
          type: [string, 'null']
          description: '`null` = bundled version. Otherwise an exact version like `1.65.0`.'

    McpConfigPatch:
      type: object
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        port: { type: integer, minimum: 0, maximum: 65535 }

    McpConfig:
      type: object
      description: No `version`, the bridge runs its bundled `@playwright/mcp`.
      required: [enabled, port]
      properties:
        enabled: { type: boolean }
        port: { type: integer, minimum: 0, maximum: 65535 }

    AllowedHosts:
      type: array
      description: |
        Host names the API answers to besides IP addresses, `localhost` and the machine's name.
        Without port or scheme. `["*"]` accepts any name. Added in API 1.5.
      items: { type: string, pattern: '^(\*|[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?)$' }

    ErrorCode:
      type: string
      description: Stable, machine-readable. New codes may be added in minor versions.
      enum: [INVALID_REQUEST, NOT_FOUND, FORBIDDEN, SERVICE_UNAVAILABLE, INTERNAL]

    ErrorBody:
      type: object
      description: |
        Body of every error response. HTTP status per code: `INVALID_REQUEST` 400, `FORBIDDEN`
        403, `NOT_FOUND` 404 (also for unknown endpoints), `SERVICE_UNAVAILABLE` 503,
        `INTERNAL` 500.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string }
            details:
              type: object
              additionalProperties: true

    WaitResult:
      description: The answer of `GET /speech/wait`. `matched` tells a match from a timeout.
      oneOf:
        - type: object
          required: [matched, entry]
          properties:
            matched: { const: true }
            entry: { $ref: '#/components/schemas/SpeechEntry' }
        - type: object
          required: [matched, entries]
          properties:
            matched: { const: false }
            entries:
              type: array
              description: Every entry seen after `since`, oldest first.
              items: { $ref: '#/components/schemas/SpeechEntry' }
