<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />
    <title>Speech Capture</title>
    <script>
      // Apply the saved theme before the first paint (no flash). Light is the default.
      try {
        var themes = ['light', 'dark', 'high-contrast', 'dark-high-contrast'];
        var saved = localStorage.getItem('sr-theme');
        document.documentElement.dataset.theme = themes.indexOf(saved) >= 0 ? saved : 'light';
      } catch {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
