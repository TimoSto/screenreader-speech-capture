name: Finalize releases

# Manual, after approving staged versions on npmjs.com (npm doesn't notify GitHub): publishes every
# draft GitHub release whose version is now live on npm (see docs/development.md#releases).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-releases
  cancel-in-progress: false

jobs:
  finalize:
    name: Finalize releases
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish drafts that are live on npm
        run: |
          drafts=$(gh release list --limit 100 --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName')
          if [[ -z "$drafts" ]]; then
            echo "No draft releases." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for tag in $drafts; do
            # Tags are `<npm name>@<version>`; the version follows the last `@`.
            name="${tag%@*}"
            version="${tag##*@}"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              gh release edit "$tag" --draft=false --latest=false
              echo "- \`$tag\`: published" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "- \`$tag\`: not on npm yet (still staged, or rejected)" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done
